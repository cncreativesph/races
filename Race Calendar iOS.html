		/* PixHero text (shows when pagination is hidden) */
		/* Base PixHero text */
			.pixhero-fallback {
			  font-family: 'Poppins', sans-serif;
			  font-weight: 900;
			  font-size: 14px;
			  color: #0a5f38;
			}

			/* Animation variants */
			.pixhero-fade {
			  opacity: 0;
			  animation: fadeIn 2500ms ease-out forwards;
			}

			.pixhero-slide-up {
			  opacity: 0;
			  transform: translateY(8px);
			  animation: slideUp 2500ms ease-out forwards;
			}

			.pixhero-slide-left {
			  opacity: 0;
			  transform: translateX(8px);
			  animation: slideLeft 2500ms ease-out forwards;
			}

			.pixhero-scale {
			  opacity: 0;
			  transform: scale(0.9);
			  animation: scaleIn 2500ms ease-out forwards;
			}

			/* Keyframes */
			@keyframes fadeIn {
			  to { opacity: 1; }
			}

			@keyframes slideUp {
			  to { opacity: 1; transform: translateY(0); }
			}

			@keyframes slideLeft {
			  to { opacity: 1; transform: translateX(0); }
			}

			@keyframes scaleIn {
			  to { opacity: 1; transform: scale(1); }
			}

			@keyframes pixHeroPop {
			  to {
				opacity: 1;
				transform: translateY(0);
			  }
			  
			}
			/* Extra animation variants */
			.pixhero-slide-right {
			  opacity: 0;
			  transform: translateX(-8px);
			  animation: slideRight 500ms ease-out forwards;
			}

			.pixhero-zoom-rotate {
			  opacity: 0;
			  transform: scale(0.85) rotate(-4deg);
			  animation: zoomRotate 550ms ease-out forwards;
			}

			.pixhero-pop {
			  opacity: 0;
			  transform: scale(0.7);
			  animation: popIn 450ms cubic-bezier(.34,1.56,.64,1) forwards;
			}

			.pixhero-float {
			  opacity: 0;
			  transform: translateY(12px);
			  animation: floatUp 600ms ease-out forwards;
			}

			.pixhero-blur-in {
			  opacity: 0;
			  filter: blur(6px);
			  animation: blurIn 550ms ease-out forwards;
			}

			/* Keyframes */
			@keyframes slideRight {
			  to { opacity: 1; transform: translateX(0); }
			}

			@keyframes zoomRotate {
			  to { opacity: 1; transform: scale(1) rotate(0deg); }
			}

			@keyframes popIn {
			  to { opacity: 1; transform: scale(1); }
			}

			@keyframes floatUp {
			  to { opacity: 1; transform: translateY(0); }
			}

			@keyframes blurIn {
			  to { opacity: 1; filter: blur(0); }
			}

<style id="pixhero-threads-dark">
/* PixHero — Threads-inspired dark theme
   Add after the existing styles. Race distance and registration status
   colors remain unchanged. No changes to calendar JavaScript are needed. */
:root {
  color-scheme: dark;
  --primary-color: #F3F3F3;
  --secondary-color: #1C1C1C;
  --accent-color: #F3F3F3;
  --text-primary: #F3F3F3;
  --text-secondary: #A8A8A8;
  --background: #101010;
  --card-bg: #181818;
  --card-border: #303030;
  --dark-green: #F3F3F3; /* legacy variable name */
  --light-green: #202020; /* legacy variable name */
  --surface-hover: #292929;
  --control-border: #484848;
  --on-accent: #101010;
}
html, body { background: var(--background); color: var(--text-primary); }
*, .poppins-black, .poppins-regular, .pixhero-fallback {
  font-family: 'Poppins', sans-serif;
}

.header {
  background: var(--background);
  color: var(--text-primary);
  border-radius: 0;
  border-bottom: 1px solid var(--card-border);
  box-shadow: none;
}

.search-bar {
  background: var(--secondary-color);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  box-shadow: none;
}
.search-bar:focus-within { border-color: #707070; }
.search-bar.error { border-color: #F87171; }
.search-bar input, #searchInput { color: var(--text-primary); caret-color: var(--text-primary); }
#searchInput::placeholder {
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 400;
  opacity: 1;
}
.search-bar .text-gray-500, .filter-header svg { color: var(--text-secondary); }
.clear-search-btn { color: var(--text-secondary); }
.search-suggestions {
  background: var(--secondary-color);
  border: 1px solid var(--card-border);
  box-shadow: 0 6px 16px #0005;
}
.suggestion-item { color: var(--text-primary); border-bottom-color: var(--card-border); }
.suggestion-item:last-child { border-bottom: 0; }
.suggestion-item:hover { background: var(--surface-hover); }
.search-inline-error, .search-error-overlay { color: #F87171; }
.favorites-control-text { color: var(--text-primary);  }
.favorites-segment { background: var(--secondary-color); border: 1px solid var(--card-border); }
.favorites-option { color: var(--text-secondary);  }
.favorites-option.active { background: var(--accent-color); color: var(--on-accent); box-shadow: none; }
.favorite-star svg { stroke: var(--text-secondary); }
/* The original red favorite-heart fill/stroke is intentionally retained. */
.filter-header { color: var(--text-primary); }
.filter-chip { background: transparent; color: var(--text-secondary); }
.filter-chip:hover { background: var(--surface-hover); color: var(--text-primary); }
.filter-chip.active, .filter-chip.active:hover { background: var(--accent-color); color: var(--on-accent);  }
#toggleFiltersButton, .toggle-button.refresh, .toggle-button.calendar, .toggle-button.photos {
  background: var(--secondary-color);
  border: 1px solid var(--control-border);
  color: var(--text-primary);
  box-shadow: none;
}
#toggleFiltersButton:hover, .toggle-button:hover { background: var(--surface-hover); }
.race-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  color: var(--text-primary);
  border-radius: 14px;
  box-shadow: none;
  will-change: auto;
}
.race-card:hover, .race-card:active { transform: none; box-shadow: none; }
.race-name { color: var(--text-primary);   }
.race-detail { color: var(--text-secondary); }
.categories-section { background: var(--light-green); border-radius: 10px; gap: 6px; }

/* Distance badges use their exact-category CSS variables. */
.register-button {
  background: var(--accent-color);
  color: var(--on-accent);
  border: 0;
  box-shadow: none;
  
  flex-shrink: 0;
}
.register-button:hover, .register-button:active { transform: none; box-shadow: none; }
/* Preserve original status colors, even during hover/press. */
.register-button.register, .register-button.register:hover, .register-button.register:active {
  background-color: #007aff; color: white;
}
.register-button.full, .register-button.full:hover, .register-button.full:active {
  background-color: #faf31e; color: black;
}
.register-button.soon, .register-button.soon:hover, .register-button.soon:active {
  background-color: #fc650c; color: black; opacity: 0.7;
}
/* Results and photographer buttons use the neutral theme. */
.register-button.results, .register-button.results:hover, .register-button.results:active {
  background-color: var(--accent-color); color: var(--on-accent);
}
.photographers-title { color: var(--text-primary);  }
.photographers-instruct { color: var(--text-secondary); }
.photographer-button {
  background: transparent;
  color: var(--text-primary);
  border: 1px solid var(--control-border);
  border-radius: 999px;
  
}
.photographer-button:hover { background: var(--surface-hover); }
#stickyFooterBar { background: var(--background); border-top: 1px solid var(--card-border); }
#paginationContainer, #paginationContainer .pagination-info,
#paginationContainer .pagination-empty, .pixhero-fallback {
  color: var(--text-secondary); 
}
#paginationContainer .pagination-button, #stickyFooterBarInner .sticky-refresh-btn, .go-top-btn,
.pagination-button {
  color: var(--text-primary);
  border: 1px solid var(--control-border);
  background: transparent;
  border-radius: 8px;
  
}
#paginationContainer .pagination-button:hover:not(.active):not(:disabled),
#stickyFooterBarInner .sticky-refresh-btn:hover, .go-top-btn:hover { background: var(--surface-hover); }
#paginationContainer .pagination-button.active, .pagination-button.active {
  background: var(--accent-color); color: var(--on-accent); border-color: var(--accent-color);
}
#raceList .text-gray-500, #raceList .text-gray-700 { color: var(--text-secondary); }
#retryButton { background: var(--accent-color); color: var(--on-accent); }
.skeleton {
  background: linear-gradient(90deg, #1C1C1C 25%, #303030 50%, #1C1C1C 75%);
  background-size: 200% 100%;
}
button:focus-visible, .filter-chip:focus-visible { outline: 2px solid #BDBDBD; outline-offset: 2px; }
/* Keep the existing compact mobile layout, allowing distance chips to wrap. */
.categories-section > .flex-1 { min-width: 0; }

</style>

<script>
    let searchErrorTimeout = null;

    // FAVORITES STORAGE
    const FAVORITES_KEY = 'pixhero_favorite_races_v1';

    // iOS STORAGE DIAGNOSTIC
    console.log('Race Calendar URL:', window.location.href);
    console.log('Storage Origin:', window.location.origin);
    console.log('Inside iframe:', window.self !== window.top);

    try {

	console.log('Current URL:', location.href);
console.log('Storage origin:', location.origin);
console.log(
    'Saved favorites:',
    localStorage.getItem(FAVORITES_KEY)
);

    let favoriteRaceKeys = new Set();

    try {
        const saved = JSON.parse(
            localStorage.getItem(FAVORITES_KEY) || '[]'
        );

        if (Array.isArray(saved)) {
            favoriteRaceKeys = new Set(saved);
        }
    } catch (error) {
        console.warn('Favorites could not be loaded:', error);
    }

    let favoritesOnly = false;

    function raceFavoriteKey(race) {
        return JSON.stringify([
            String(race.name || '').trim().toLowerCase(),
            String(race.date || '').trim().toLowerCase(),
            String(race.location || '').trim().toLowerCase()
        ]);
    }

    function toggleRaceFavorite(race) {
        const key = raceFavoriteKey(race);

        if (favoriteRaceKeys.has(key)) {
            favoriteRaceKeys.delete(key);
        } else {
            favoriteRaceKeys.add(key);
        }

        try {
            localStorage.setItem(
                FAVORITES_KEY,
                JSON.stringify([...favoriteRaceKeys])
            );
        } catch (error) {
            console.warn('Favorites could not be saved:', error);
        }
    }
		
        // State management

            races: [],
            photos: [],
            filters: {
				location: [], 
                distance: [],

                year: [],
                day: []

            searchTerm: '',
            filtersVisible: true,
            expandedFilters: {
				location: true,

            pagination: { page: 1, perPage: 25 }

        // DOM elements

        const refreshButton = document.getElementById('refreshButton');

		const clearSearchBtn = document.getElementById('clearSearchBtn');

		function toggleClearBtn(){
		  clearSearchBtn.classList.toggle('hidden', !searchInput.value.trim());
		}

		const searchInlineError = document.getElementById('searchInlineError');

		function positionInlineError() {
		  const value = searchInput.value || '';
		  const span = document.createElement('span');
		  span.style.visibility = 'hidden';
		  span.style.whiteSpace = 'pre';
		  span.style.font = window.getComputedStyle(searchInput).font;
		  span.textContent = value;

		  document.body.appendChild(span);
		  const textWidth = span.getBoundingClientRect().width / (parseFloat(getComputedStyle(document.documentElement).zoom) || 1);
		  document.body.removeChild(span);

		  searchInlineError.style.left = `${8 + textWidth}px`;
		}

		searchInput.addEventListener('input', () => {
		  state.searchTerm = searchInput.value.trim();
		  toggleClearBtn();
		});

        function resetPaginationForSearch() {

        const searchSuggestions = document.getElementById('searchSuggestions');
        const toggleFiltersButton = document.getElementById('toggleFiltersButton');

        async function fetchData(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                const text = await response.text();
                try {
                    const data = JSON.parse(text);
                    // Check if data is an array
                    if (!Array.isArray(data)) {
                        console.error('Data is not an array:', data);
                        throw new Error('Invalid data format: expected an array');
                    }
                    return data;
                } catch (parseError) {
                    console.error('JSON Parse Error:', parseError);
                    console.error('Raw response:', text.substring(0, 200) + '...'); // Log first 200 chars
                    throw new Error(`Invalid JSON format: ${parseError.message}`);
                }
            } catch (error) {
                console.error('Fetch Error:', error);
                throw error;
            }
        }

                    year: [],

                        primeDistanceColors(data, 'distanceP');
                        renderPhotos();

                } else {
                    try {

                        showError(`Failed to load race data: ${error.message}`);
                    }

            } catch (error) {
                console.error('Error loading data:', error);
                showError(`An error occurred while loading data: ${error.message}`);
            }

		function sortRacesByDateAndName(races) {
			return races.sort((a, b) => {
				const dateA = new Date(a.date);
				const dateB = new Date(b.date);

				// 1️⃣ Sort by event date
				if (!isNaN(dateA) && !isNaN(dateB)) {
					if (dateA.getTime() !== dateB.getTime()) {
						return dateA - dateB;
					}
				}

				// 2️⃣ If same date, sort alphabetically by race name
				const nameA = (a.name || '').toLowerCase();
				const nameB = (b.name || '').toLowerCase();

				return nameA.localeCompare(nameB);
			});
		}

            `;

            const original = String(name).trim().toUpperCase();
            const key = original.replace(/[^A-Z0-9]+/g, '');
            if (key.includes('RUNRIO')) return 'RUNRIO';
            if (key.includes('GREENMEDIA')) return 'GREEN MEDIA';
            if (key.includes('HYVESPORTS')) return 'HYVESPORTS';
            if (key.includes('MNLCITYRUN') || key.includes('RULERICHEVENTSMANAGEMENT') || key.includes('RULEANDRICHEVENTSMANAGEMENT')) return 'MNL CITY RUN';
            if (key.includes('ONYOURMARK')) return 'ON YOUR MARK';

            if (key.includes('RSRJ')) return 'RSRJ';
            if (key.includes('SMOKE10')) return 'SMOKE10';
            if (key.includes('TV8MEDIA')) return 'TV8 MEDIA';
            return original;
        }

		function normalizeLocation(loc) {
		  if (!loc) return '';
		  const s = loc.trim().toLowerCase();

		  // MOA
		  if (s === 'moa' || s.includes('mall of asia')) return 'Mall of Asia, Pasay City';
		  if (s.includes('mall of asia, pasay')) return 'Mall of Asia, Pasay City';

		  // Filinvest
		  if (s.includes('filinvest')) return 'Filinvest, Alabang, Muntinlupa City';

		  // Ayala
		  if (s.includes('ayala') && s.includes('makati')) return 'Ayala, Makati City';

		  // UP Diliman
		  if (s.includes('up diliman')) return 'UP Diliman, Quezon City';
		  if (s.includes('up diliman, quezon')) return 'UP Diliman, Quezon City';

		  // Vermosa
		  if (s.includes('vermosa')) return 'Vermosa, Imus, Cavite';

		  // Quirino
	
		  if (
			  (s.includes('quirino') && s.includes('grandstand')) ||
			  s.includes('quirino grand stand')
			) {
			  return 'Quirino Grandstand, City of Manila';
			}

		  // Fort Santiago
		  if (s.includes('fort santiago')) return 'Fort Santiago, Intramuros, City of Manila';

		  // default: title case-ish (optional)
		  return loc.trim();
		}

		function normalizeDistance(raw) {
		  if (!raw) return '';
			  let s = String(raw).trim().replace(/\s+/g, ' ');

			  // ✅ METERS FIRST: 711m, 711 m, 500m, 500 m -> 711M / 500M
			  // (avoid catching km)
			  const meterMatch = s.match(/^(\d+(?:\.\d+)?)\s*m\b\s*(.*)$/i);
			  if (meterMatch && !/\bkm\b/i.test(s)) {
				// keep as meters, never convert to KM
				const num = meterMatch[1];
				const rest = (meterMatch[2] || '').trim();
                const label = rest.split(' ').filter(Boolean)
                    .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
                return `${num}M${label ? ' ' + label : ''}`;
			  }

			  // ✅ KM forms (supports decimals): 21k, 21 km, 21, 2.5km, 1.5 k, etc.
			  // plus optional label after: "1k dog" -> "1KM Dog"
			  // ✅ KM forms (supports decimals) — REQUIRE unit (k/km)
			const kmMatch = s.match(/^(\d+(?:\.\d+)?)\s*(k|km)\b\s*(.*)$/i);
			if (kmMatch) {
			  const num = kmMatch[1];                 // supports 2.5, 1.5, etc.
			  const rest = (kmMatch[3] || '').trim();

			  let result = `${num}KM`;

			  if (rest) {
				const label = rest
				  .split(' ')
				  .filter(Boolean)
				  .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
				  .join(' ');
				result += ` ${label}`;
			  }
			  return result;
			}

			// ✅ If it's ONLY a number (like "21"), treat as KM
			const numOnly = s.match(/^(\d+(?:\.\d+)?)$/);
			if (numOnly) {
			  return `${numOnly[1]}KM`;
			}


			  // fallback
			  return s.toUpperCase();
			}

        // Format date string
        function formatDate(dateStr) {
			if (!dateStr) return '';

			// Force a safe parse: "May 1, 2026" → "2026-05-01"
			const parsed = dateStr.replace(/(\w+)\s(\d+),\s(\d+)/, '$1 $2 $3');
			const date = new Date(parsed + ' 00:00:00');

			if (isNaN(date.getTime())) return dateStr;

			const formattedDate = date.toLocaleDateString('en-US', {
				year: 'numeric',
				month: 'long',
				day: 'numeric'
			});

			const dayName = date.toLocaleDateString('en-US', { weekday: 'long' });

			return `${formattedDate} (${dayName})`;
		}

        // Exact distance/category colors. No substring matching.
        // Keep familiar colors where possible, but separate easily confused distances.
        const DISTANCE_COLORS = new Map(Object.entries({
            '100KM': '#783C94',
            '75KM': '#C58BD8',
            '60KM': '#784B36',
            '50KM': '#236B99',
            '42KM': '#FF2D55',
            '32KM': '#5856D6',
            '30KM': '#A65A2B',
            '25KM': '#92C7F5',
            '24KM': '#785FBA',
            '21KM': '#007AFF',
            '20KM': '#B9C65A',
            '16KM': '#237A3C',
            '15KM': '#D8B895',
            '12KM': '#B63E71',
            '10KM': '#FF9500',
            '8KM': '#C5B4FA',
            '7KM': '#A8E08F',
            '6KM': '#B05F00',
            '5KM': '#AF52DE',
            '4KM': '#687B99',
            '3KM': '#FF3B30',
            '2.5KM': '#D6A5F5',
            '2KM': '#5AC8FA',
            '1.5KM': '#F7D154',
            '1KM': '#36D6C2',
            '1KM DOG': '#F8A8C4',
            '500M': '#A6A6A6',
            '711M': '#EBA68C'
        }));
        const usedDistanceColors = new Set(DISTANCE_COLORS.values());

        function distanceColorKey(category) {
            const label = normalizeDistance(category).toUpperCase().trim();
            // Normalize numeric aliases (5, 5K, 5.0KM), but retain every qualifier.
            const match = label.match(/^(\d+(?:\.\d+)?)\s*(KM|M)\b\s*(.*)$/);
            if (match) {
                const suffix = match[3].trim().replace(/\s+/g, ' ');
                return `${Number(match[1])}${match[2]}${suffix ? ' ' + suffix : ''}`;
            }
            if (/^HALF(?:[ -]MARATHON)?$/.test(label)) return '21KM';
            return label || 'OTHER';
        }

        // Stable generated color for future distances, relays and special labels.
        // Resolve exact RGB collisions rather than reusing another category's color.
        function getDistanceColor(category) {
            const key = distanceColorKey(category);
            if (DISTANCE_COLORS.has(key)) return DISTANCE_COLORS.get(key);
            let hash = 2166136261;
            for (let i = 0; i < key.length; i++) {
                hash = Math.imul(hash ^ key.charCodeAt(i), 16777619) >>> 0;
            }
            let color;
            for (let attempt = 0; ; attempt++) {
                const code = (hash + Math.imul(attempt, 0x9e3779b9)) >>> 0;
                const h = (code % 360) / 60;
                const sat = (55 + ((code >>> 9) % 26)) / 100;
                const light = (38 + ((code >>> 17) % 36)) / 100;
                const c = (1 - Math.abs(2 * light - 1)) * sat;
                const x = c * (1 - Math.abs(h % 2 - 1));
                const m = light - c / 2;
                const rgb = [[c,x,0],[x,c,0],[0,c,x],[0,x,c],[x,0,c],[c,0,x]][Math.floor(h)];
                color = '#' + rgb.map(v => Math.round((v + m) * 255).toString(16).padStart(2,'0')).join('').toUpperCase();
                if (!usedDistanceColors.has(color)) break;
            }
            DISTANCE_COLORS.set(key, color);
            usedDistanceColors.add(color);
            return color;
        }

        function applyDistanceColor(chip, category) {
            const color = getDistanceColor(category);
            const rgb = color.slice(1).match(/../g).map(v => parseInt(v, 16) / 255);
            const linear = rgb.map(v => v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
            const luminance = linear[0] * 0.2126 + linear[1] * 0.7152 + linear[2] * 0.0722;
            // Choose the higher-contrast foreground (white or black).
            const foreground = 1.05 / (luminance + 0.05) >= (luminance + 0.05) / 0.05 ? '#FFFFFF' : '#000000';
            chip.style.setProperty('--distance-bg', color);
            chip.style.setProperty('--distance-fg', foreground);
        }

  const s = (normLoc || "").toLowerCase();

  for (const group of LOCATION_GROUPS) {
    if (group.keywords.some(k => s.includes(k))) {
      return group.name;
    }
  }

  return "Others"; // ✅ unmatched locations go here
}

if (s === 'vermosa' || s === 'vermosa cavite' || s === 'vermosa cavite city'|| s === 'vermosa, cavite' || s === 'vermosa, cavite city') {

        // Filter data based on current filters - only used for races view
        function filterData(data, isPhotos) {
            if (!Array.isArray(data)) {
                console.error('Invalid data format: expected an array, got', typeof data);
                return [];
            }
            
            // For photos view, return all data without filtering
            if (isPhotos) {
                return data;
            }
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
return data.filter(item => {
    const name = item.name;
    const date = item.date;
    const location = item.location;
    const distance = item.distance;
    const organizer = item.organizer;

    // FAVORITES FILTER
    if (!isPhotos && favoritesOnly &&
        !favoriteRaceKeys.has(raceFavoriteKey(item))) {
        return false;
    }

    // Date filter - only show future dates for races
                if (date) {
					const itemDate = new Date(date);
					if (!isNaN(itemDate.getTime())) {
						itemDate.setHours(0, 0, 0, 0);
						if (itemDate <= today) return false;  // ✅ blocks past AND today
					}
				}
				
				if (state.filters.year && state.filters.year.length > 0 && date) {
				  const itemDate = new Date(date);
				  if (!isNaN(itemDate.getTime())) {
					const y = itemDate.getFullYear().toString();
					if (!state.filters.year.includes(y)) return false;
				  }
				}
                
				// Location filter
			if (state.filters.location.length > 0) {
			  const normLoc = normalizeLocation(item.location || item.locationP || "");
			  const locGroup = getLocationGroupFromNormalized(normLoc);

			  if (!state.filters.location.includes(locGroup)) {
				return false;
			  }
			}

                // Search term filter
                if (state.searchTerm) {
                    const searchLower = state.searchTerm.toLowerCase();
					
					const dayName = (date && !isNaN(new Date(date).getTime()))
					  ? new Intl.DateTimeFormat('en-US', { weekday: 'long' })
						  .format(new Date(date))
						  .toLowerCase()
					  : '';
							  
                    const rawSearch = state.searchTerm.trim();
					const looksLikeDistance = /^\d+(?:\.\d+)?\s*(km|k|m)?(\s|$)/i.test(rawSearch);

					// for "2-MAN RELAY" vs "2 man relay" matching
					const searchTextNorm = rawSearch
					  .toLowerCase()
					  .replace(/[-_]+/g, ' ')
					  .replace(/\s+/g, ' ')
					  .trim();

					const matchesSearch =
					  // ✅ IMPORTANT: if search looks like a distance, do NOT match race name (prevents 1KM matching 21KM in name)
					  (!looksLikeDistance && name && name.toLowerCase().includes(searchLower)) ||

					  (normalizeKey(normalizeLocation(location)).includes(normalizeKey(searchLower))) ||
					  (organizer && (organizer.toLowerCase().includes(searchLower) || normalizeOrganizerName(organizer).toLowerCase().includes(searchLower))) ||

					  // ✅ Distance/category match (supports BOTH: numeric distances + text categories like 2-MAN RELAY)
					  (() => {
						if (!distance) return false;

						// If user typed a real distance (e.g., 1KM / 500M), use your “safe distance” logic
						if (looksLikeDistance) {
						  const sDist = normalizeDistance(rawSearch);
						  const tokens = distance.split(',').map(d => normalizeDistance(d));

						  // exact token match OR "1KM" matches "1KM Dog" (prefix + space)
						  return tokens.some(t => t === sDist || t.startsWith(sDist + ' '));
						}

						// If user typed a text category (e.g., "2-MAN RELAY"), match against raw distance tokens (normalized text)
						const tokensRaw = distance.split(',').map(d => (d || '').trim()).filter(Boolean);
						return tokensRaw.some(t => {
						  const tNorm = t
							.toLowerCase()
							.replace(/[-_]+/g, ' ')
							.replace(/\s+/g, ' ')
							.trim();
						  return tNorm.includes(searchTextNorm);
						});
					  })() ||

					  (dayName && dayName.includes(searchLower));

                    
                    // Check for date matches in various formats
                    let matchesDate = false;
                    if (date) {
                        const itemDate = new Date(date);
                        if (!isNaN(itemDate.getTime())) {
                            // Format the date in various ways to match against search
                            const monthNames = ['january', 'february', 'march', 'april', 'may', 'june', 
                                              'july', 'august', 'september', 'october', 'november', 'december'];
                            const shortMonthNames = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 
                                                   'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];

                            
                            const month = itemDate.getMonth();
                            const day = itemDate.getDate();
                            const year = itemDate.getFullYear();
                            const shortYear = year % 100;
                            
                            // Various date formats
                            const dateFormats = [
                                `${monthNames[month]} ${day}`,
                                `${shortMonthNames[month]} ${day}`,
                                `${month + 1}/${day}`,
                                `${month + 1}-${day}`,
                                `${month + 1}/${day}/${year}`,
                                `${month + 1}/${day}/${shortYear}`,
                                `${month + 1}-${day}-${year}`,
                                `${month + 1}-${day}-${shortYear}`,
                                `${day}/${month + 1}`,
                                `${day}-${month + 1}`,
                                `${day}/${month + 1}/${year}`,
                                `${day}/${month + 1}/${shortYear}`,
                                `${day}-${month + 1}-${year}`,
                                `${day}-${month + 1}-${shortYear}`,
                                `${monthNames[month]} ${day}, ${year}`,
                                `${shortMonthNames[month]} ${day} ${year}`
                            ];
                            
                            // Add padding variations
                            const paddedMonth = (month + 1).toString().padStart(2, '0');
                            const paddedDay = day.toString().padStart(2, '0');
                            
                            dateFormats.push(
                                `${paddedMonth}/${paddedDay}`,
                                `${paddedMonth}-${paddedDay}`,
                                `${paddedMonth}/${paddedDay}/${year}`,
                                `${paddedMonth}/${paddedDay}/${shortYear}`,
                                `${paddedMonth}-${paddedDay}-${year}`,
                                `${paddedMonth}-${paddedDay}-${shortYear}`
                            );
							
                            dateFormats.push(
								`${year}`,
								`${shortYear}`
							);
                            matchesDate = dateFormats.some(format =>
							format.toLowerCase().includes(searchLower)
							);
							
							// Allow searching by just the year (e.g., "2026")
							if (`${year}`.includes(searchLower) || `${shortYear}` === searchLower) {
							matchesDate = true;
							}
                            
                            // Also check if search is just the month name
                            if (monthNames[month].includes(searchLower) || shortMonthNames[month].includes(searchLower)) {
                                matchesDate = true;
                            }
                        }
                    }
                    
                    if (!matchesSearch && !matchesDate) return false;
                }


								// Location group
				const normLoc = normalizeLocation(item.location || item.locationP || "");
				const locGroup = getLocationGroupFromNormalized(normLoc);
				locations.add(locGroup);

                // Distance filter
                if (state.filters.distance.length > 0 && distance) {
				  const itemDistances = distance
					.split(',')
					.map(d => normalizeDistance(d.trim())); // ✅ normalize JSON distances

				  if (!itemDistances.some(d => state.filters.distance.includes(d))) {
					return false;
				  }
				}
                
                // Organizer filter
                if (state.filters.organizer.length > 0) {
                    if (!state.filters.organizer.includes(organizerFilterGroup(organizer))) {
                        return false;
                    }
                }
                
                // Month filter
                if (state.filters.month.length > 0 && date) {
                    const itemDate = new Date(date);
                    if (!isNaN(itemDate.getTime())) {
                        const monthName = new Intl.DateTimeFormat('en-US', { month: 'long' }).format(itemDate);
                        if (!state.filters.month.includes(monthName)) {
                            return false;
                        }
                    }
                }
                
                // Year filter
                if (state.filters.year.length > 0 && date) {
                    const itemDate = new Date(date);
                    if (!isNaN(itemDate.getTime())) {
                        const year = itemDate.getFullYear().toString();
                        if (!state.filters.year.includes(year)) {
                            return false;
                        }
                    }
                }
                
                // Day filter
                if (state.filters.day.length > 0 && date) {
                    const itemDate = new Date(date);
                    if (!isNaN(itemDate.getTime())) {
                        const day = itemDate.getDay();
                        const dayName = day === 6 ? 'Saturday' : day === 0 ? 'Sunday' : '';
                        if (!state.filters.day.includes(dayName)) {
                            return false;
                        }
                    }
                }
                
                return true;
            });
        }

                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />

        document.querySelectorAll('.filter-header').forEach(header => {

                state.expandedFilters[filterName] = !state.expandedFilters[filterName];

<script>
(function () {
  const bar = document.getElementById('stickyFooterBar');
  if (!bar) return;
  const root = document.documentElement;
  const handle = document.getElementById('paginationDragHandle');
  const inner = document.getElementById('stickyFooterBarInner');
  const header = document.querySelector('.header');
  const mobile = window.matchMedia('(max-width: 768px), (pointer: coarse)');
  const ios = root.classList.contains('ios-compact');
  const documentScale = ios ? 0.9 : 1;
  const footerScale = documentScale;
  const storageKey = ios ? 'pixhero.calendar.pagination.clearance.v6' : 'pixhero.calendar.pagination.clearance.v5';

    const rect = bar.getBoundingClientRect();
    const viewport = window.innerHeight;

    const headerBottom = header ? Math.max(0, header.getBoundingClientRect().bottom) : 0;

    const { min, max } = limits;
    applied = Math.round(Math.min(max, Math.max(min, value)));

    root.style.setProperty('--native-nav-clearance', (applied / documentScale) + 'px');

  // Preserve ordinary taps and allow intentional horizontal swipes if needed.
  let suppressClick = false;
  bar.addEventListener('pointerdown', event => {
    if (!event.isPrimary || event.button !== 0 || drag) return;

    try { event.target.setPointerCapture(event.pointerId); } catch (_) {}

    const current = scrollPosition();

      bar.classList.remove('is-scroll-hidden');
